e":"teacher","origin":"manual","time":["50 min","50 min"],"kind":["Evaluación","Avaluació"],"group":["Individual","Individual"],"mode":["Ruta de juegos interactivos (Educaplay): test, DAFO y ordenar","Ruta de jocs interactius (Educaplay): test, DAFO i ordenar"],"ra":"RA3","ce":"c, e, f, g, i","title":["Itinerario profesional personalizado: Diseña tu ruta profesional","Itinerari professional personalitzat: Dissenya la teva ruta professional"],"statement":[{"t":"p","x":["Construye un itinerario profesional con diagnóstico, DAFO, objetivos SMART y acciones formativas, recorriendo cinco pasos en tres juegos:","Construeix un itinerari professional amb diagnòstic, DAFO, objectius SMART i accions formatives, recorrent cinc passos en tres jocs:"]},{"t":"list","k":"ol","l":1,"items":[["Paso 1 — Test de diagnóstico: 8 preguntas sobre formación previa, experiencia, intereses, competencias y expectativas laborales.","Pas 1 — Test de diagnòstic: 8 preguntes sobre formació prèvia, experiència, interessos, competències i expectatives laborals."],["Paso 2 — DAFO interactivo: clasifica 12 afirmaciones en fortalezas, debilidades, oportunidades y amenazas.","Pas 2 — DAFO interactiu: classifica 12 afirmacions en fortaleses, febleses, oportunitats i amenaces."],["Paso 3 — Objetivos SMART: identifica qué hace que un objetivo sea específico, medible, alcanzable, relevante y temporizado.","Pas 3 — Objectius SMART: identifica què fa que un objectiu sigui específic, mesurable, assolible, rellevant i temporitzat."],["Paso 4 — Ruta formativa: ordena cronológicamente las acciones de un itinerario (diagnóstico, formación complementaria, certificado profesional, prácticas, búsqueda activa y revisión del plan).","Pas 4 — Ruta formativa: ordena cronològicament les accions d'un itinerari (diagnòstic, formació complementària, certificat professional, pràctiques, cerca activa i revisió del pla)."],["Paso 5 — Decisión final: elige una de tres rutas (cualificación inicial, recualificación o mejora de la empleabilidad) y justifica tu elección.","Pas 5 — Decisió final: tria una de tres rutes (qualificació inicial, requalificació o millora de l'ocupabilitat) i justifica l'elecció."]],"start":1},{"t":"p","x":["Resultado esperado: el resultado de cada juego y una reflexión final escrita, incluyendo la igualdad de trato y la no discriminación en la orientación.","Resultat esperat: el resultat de cada joc i una reflexió final escrita, incloent-hi la igualtat de tracte i la no-discriminació en l'orientació."]}],"criteria":[{"ra":"RA3","title":["Asesora al alumnado destinatario de la acción formativa sobre itinerarios formativos, formación profesional y oportunidades de empleo, permitiéndoles la cualificación y recualificación de manera personalizada.","Assessora l'alumnat destinatari de l'acció formativa sobre itineraris formatius, formació professional i oportunitats d'ocupació, cosa que els permet la qualificació i requalificació de manera personalitzada."],"ce":[["CE3c",["Se han considerado indicadores personales, profesionales y psicosociales para el diseño del itinerario formativo-profesional del alumnado.","S'han considerat indicadors personals, professionals i psicosocials per al disseny de l'itinerari formatiu-professional de l'alumnat."]],["CE3e",["Se han elaborado itinerarios formativos y profesionales individualizados, en función de la formación previa, la experiencia, los intereses y las características personales y competencias profesionales del alumnado inscrito en una acción formativa.","S'han elaborat itineraris formatius i professionals individualitzats, en funció de la formació prèvia, l'experiència, els interessos i les característiques personals i competències professionals de l'alumnat inscrit en una acció formativa."]],["CE3f",["Se ha asesorado al alumnado sobre las ofertas formativas del Sistema de Formación Profesional y las oportunidades de empleo a partir de la identificación de los objetivos personales.","S'ha assessorat l'alumnat sobre les ofertes formatives del Sistema de Formació Professional i les oportunitats d'ocupació a partir de la identificació dels objectius personals."]],["CE3g",["Se ha valorado el aprendizaje autónomo del alumnado destinatario, reconociendo su valor profesionalizador.","S'ha valorat l'aprenentatge autònom de l'alumnat destinatari, reconeixent el seu valor professionalitzador."]],["CE3i",["Se ha considerado la igualdad de trato, evitando discriminaciones directas o indirectas por razón de sexo durante el proceso de orientación profesional.","S'ha considerat la igualtat de tracte, evitant discriminacions, directes o indirectes per raó de sexe durant el procés d'orientació professional."]]]}],"embed":[{"t":"embed","title":["Juego 1 · Diagnóstico, objetivos SMART y decisión (Educaplay)","Joc 1 · Diagnòstic, objectius SMART i decisió (Educaplay)"],"src":"https://www.educaplay.com/game/31527295-disena_tu_ruta_profesional_diagnostico_objetivos_smart_y_decision.html","url":"https://www.educaplay.com/game/31527295-disena_tu_ruta_profesional_diagnostico_objetivos_smart_y_decision.html","ratio":"16:9","h":700},{"t":"embed","title":["Juego 2 · El DAFO de Marta (Educaplay)","Joc 2 · El DAFO de la Marta (Educaplay)"],"src":"https://www.educaplay.com/game/31527592-disena_tu_ruta_profesional_el_dafo_de_marta.html","url":"https://www.educaplay.com/game/31527592-disena_tu_ruta_profesional_el_dafo_de_marta.html","ratio":"16:9","h":700},{"t":"embed","title":["Juego 3 · Ordena tu itinerario formativo (Educaplay)","Joc 3 · Ordena el teu itinerari formatiu (Educaplay)"],"src":"https://www.educaplay.com/game/31527881-disena_tu_ruta_profesional_ordena_tu_itinerario_formativo.html","url":"https://www.educaplay.com/game/31527881-disena_tu_ruta_profesional_ordena_tu_itinerario_formativo.html","ratio":"16:9","h":700}],"fields":[["Puntuación de cada juego (1, 2 y 3)","Puntuació de cada joc (1, 2 i 3)"],["Ruta elegida (cualificación inicial, recualificación o mejora de la empleabilidad) y justificación","Ruta triada (qualificació inicial, requalificació o millora de l'ocupabilitat) i justificació"],["Reflexión final: cómo garantizas la igualdad de trato y la no discriminación en este itinerario","Reflexió final: com garanteixes la igualtat de tracte i la no-discriminació en aquest itinerari"]],"rubric":["Instrumento de evaluación: corrección automática con la herramienta digital (actividad tipo quiz) y reflexión final escrita.","Instrument d'avaluació: correcció automàtica amb l'eina digital (activitat tipus quiz) i reflexió final escrita."],"block":"S1"},{"id":"s1-repaso","type":"mcq","time":["10 min","10 min"],"ra":"RA3","ce":"f, h","title":["Repaso de la sesión 1","Repàs de la sessió 1"],"questions":[{"q":["¿Qué grado del Sistema de FP corresponde a los certificados profesionales?","Quin grau del Sistema d'FP correspon als certificats professionals?"],"opts":[["Grado A","Grau A"],["Grado B","Grau B"],["Grado C","Grau C"]],"ans":2,"exp":["Apartado 3.4.","Apartat 3.4."]},{"q":["¿Cómo se llamaban antes los certificados profesionales?","Com s'anomenaven abans els certificats professionals?"],"opts":[["Certificados de profesionalidad","Certificats de professionalitat"],["Títulos de técnico","Títols de tècnic"],["Suplementos Europass","Suplements Europass"]],"ans":0,"exp":["Apartado 3.4.2.","Apartat 3.4.2."]},{"q":["«Upskilling» significa…","«Upskilling» significa…"],"opts":[["recualificarse para otra ocupación","requalificar-se per a una altra ocupació"],["actualizar las competencias","actualitzar les competències"],["acreditar la experiencia","acreditar l'experiència"]],"ans":1,"exp":["Reskilling es recualificación; upskilling, actualización.","Reskilling és requalificació; upskilling, actualització."]},{"q":["¿Cuál de estas es una competencia clave para el aprendizaje permanente?","Quina d'aquestes és una competència clau per a l'aprenentatge permanent?"],"opts":[["Personal, social y de aprender a aprender","Personal, social i d'aprendre a aprendre"],["Conducción de vehículos","Conducció de vehicles"],["Contabilidad avanzada","Comptabilitat avançada"]],"ans":0,"exp":["Apartado 3.5.3.","Apartat 3.5.3."]}],"block":"S1","origin":"complementaria"}],"notes":[["Texto de la unidad: programación didáctica de la UD3 (en catalán) y temario de la UD3; cada texto se ha traducido con fidelidad al otro idioma. Se han aplicado las precisiones del docente: Cedefop es el Centro Europeo para el Desarrollo de la Formación Profesional y los antiguos certificados de profesionalidad son hoy certificados profesionales (grado C), según TodoFP.","Text de la unitat: programació didàctica de la UD3 (en català) i temari de la UD3; cada text s'ha traduït amb fidelitat a l'altre idioma. S'han aplicat les precisions del docent: el Cedefop és el Centre Europeu per al Desenvolupament de la Formació Professional i els antics certificats de professionalitat són avui certificats professionals (grau C), segons TodoFP."]],"cover":{"signs":[["info","layers",["Grados A, B y C: ascendentes y acumulables","Graus A, B i C: ascendents i acumulables"]],["must","doc",["Grado C = certificado profesional","Grau C = certificat professional"]],["info","chart",["EQF: 8 niveles por resultados de aprendizaje","EQF: 8 nivells per resultats d'aprenentatge"]],["safe","star",["8 competencias clave para aprender toda la vida","8 competències clau per aprendre tota la vida"]]],"lead":["La orientación profesional debe asesorar sobre las vías que enlazan la formación, el reconocimiento de la experiencia y las oportunidades de recualificación y actualización a lo largo de la vida.","L'orientació professional ha d'assessorar sobre les vies que enllacen la formació, el reconeixement de l'experiència i les oportunitats de requalificació i actualització al llarg de la vida."]},"art":"learn","parts":[{"title":["Grados, certificados profesionales, EQF y ruta profesional","Graus, certificats professionals, EQF i ruta professional"],"time":["3 h","3 h"],"min":180}]},{"id":"S2","ud":"UD3","title":["3.1, 3.3 y 3.5. Calidad de la formación, actualización docente y programas europeos","3.1, 3.3 i 3.5. Qualitat de la formació, actualització docent i programes europeus"],"meta":{"ra_fp":"RA4","ce_txt":"RA4 a, b, c, d, e, f, h, i","pes":["RA4: 9,75 h de la unidad (sesiones 2 y 3)","RA4: 9,75 h de la unitat (sessions 2 i 3)"]},"sections":[{"num":1,"kind":"theory","title":["3.1.1. Evaluación de la calidad de las acciones formativas","3.1.1. Avaluació de la qualitat de les accions formatives"],"nodes":[{"t":"p","x":["La evaluación de la calidad de las acciones formativas del Sistema de Formación Profesional es un proceso sistemático, continuado y estructurado que verifica el grado de cumplimiento de los objetivos pedagógicos, la eficacia de la orientación profesional y la adecuación de los aprendizajes a las necesidades reales del tejido productivo.","L'avaluació de la qualitat en les accions formatives del Sistema de Formació Professional és un procés sistemàtic, continuat i estructurat orientat a verificar el grau d'acompliment dels objectius pedagògics, l'eficàcia de l'orientació professional i l'adequació dels aprenentatges a les necessitats reals del teixit productiu."]},{"t":"box","k":"idea","label":null,"nodes":[{"t":"p","x":["Idea clave: la evaluación de la calidad es un dispositivo de mejora continua, no solo una medida de los resultados al final del curso.","Idea clau: l'avaluació de la qualitat és un dispositiu de millora contínua, no només una mesura dels resultats al final del curs."]}]},{"t":"viz","v":{"type":"chain","title":["Tres dimensiones de la evaluación","Tres dimensions de l'avaluació"],"items":[{"i":"search","s":"info","x":["Inicial o diagnóstica","Inicial o diagnòstica"],"d":["Características de entrada del alumnado, sus necesidades formativas y el contexto tecnológico de la especialidad.","Característiques d'entrada de l'alumnat, les seves necessitats formatives i el context tecnològic de l'especialitat."]},{"i":"wrench","s":"warn","x":["De proceso o formativa (seguimiento)","De procés o formativa (seguiment)"],"d":["Detecta desviaciones, dificultades de aprendizaje o ineficiencias metodológicas y permite ajustes inmediatos.","Detecta desviacions, dificultats d'aprenentatge o ineficiències metodològiques i permet ajustos immediats."]},{"i":"target","s":"safe","x":["Final y de impacto","Final i d'impacte"],"d":["Nivel de adquisición de competencias, satisfacción de los participantes e inserción o mejora laboral.","Nivell d'adquisició de competències, satisfacció dels participants i inserció o millora laboral."]}]}},{"t":"links","title":null,"items":[{"i":"checklist","x":["EQAVET: marco europeo de calidad (TodoFP)","EQAVET: marc europeu de qualitat (TodoFP)"],"d":["El marco de calidad y tres primeros pasos para aplicarlo: prospección inicial, identificación de descriptores e indicadores y autoevaluación (en castellano).","El marc de qualitat i tres primers passos per aplicar-lo: prospecció inicial, identificació de descriptors i indicadors i autoavaluació (en castellà)."],"url":"https://todofp.es/evaluacion-calidad/eqavet.html"}]}],"acts":["s2-dim"],"videos":[],"part":1,"time":["45 min","45 min"]},{"num":2,"kind":"theory","title":["3.1.2. Indicadores de evaluación de la calidad","3.1.2. Indicadors d'avaluació de la qualitat"],"nodes":[{"t":"p","x":["Los indicadores de calidad se organizan en cuatro categorías:","Els indicadors de qualitat s'organitzen en quatre categories:"]},{"t":"table","rows":[[["Categoría","Categoria"],["Qué miden","Què mesuren"],["Indicadores clave","Indicadors clau"]],[["Eficacia","Eficàcia"],["Grado de consecución de los objetivos formativos y competenciales programados.","Grau de consecució dels objectius formatius i competencials programats."],["Tasa de finalización y superación; % de alumnado que obtiene la cualificación; logro de los resultados de aprendizaje.","Taxa de finalització i superació; % d'alumnat que obté la qualificació; assoliment dels resultats d'aprenentatge."]],[["Eficiencia","Eficiència"],["Resultados en relación con los recursos materiales, temporales y humanos.","Resultats en relació amb els recursos materials, temporals i humans."],["Coste por alumno y hora; aprovechamiento de instalaciones y herramientas digitales; ajuste a la temporalización.","Cost per alumne i hora; aprofitament d'instal·lacions i eines digitals; ajust a la temporització."]],[["Impacto y empleabilidad","Impacte i ocupabilitat"],["Transferencia de los aprendizajes y mejora de la inserción.","Transferència dels aprenentatges i millora de la inserció."],["Inserción a los 6 y 12 meses; recualificación o promoción; satisfacción de las empresas contratantes.","Inserció als 6 i 12 mesos; requalificació o promoció; satisfacció de les empreses contractants."]],[["Satisfacción","Satisfacció"],["Percepción de alumnado, docentes y empresas.","Percepció d'alumnat, docents i empreses."],["Valoración docente y tutorial; infraestructuras, herramientas y materiales; utilidad de la orientación.","Valoració docent i tutorial; infraestructures, eines i materials; utilitat de l'orientació."]]]},{"t":"p","x":["La guía didáctica del módulo añade indicadores como la satisfacción del alumnado, la tasa de aprobados, la empleabilidad posformación y la adecuación de los contenidos al mercado laboral, y la evaluación continua mediante encuestas, exámenes o trabajos prácticos.","La guia didàctica del mòdul afegeix indicadors com la satisfacció de l'alumnat, la taxa d'aprovats, l'ocupabilitat posformació i l'adequació dels continguts al mercat laboral, i l'avaluació contínua mitjançant enquestes, exàmens o treballs pràctics."]},{"t":"links","title":null,"items":[{"i":"chart","x":["Indicadores EQAVET (documento de consulta, PDF)","Indicadors EQAVET (document de consulta, PDF)"],"d":["Indicadores como la participación del profesorado en formación continua o las tasas de finalización, con su cálculo y utilidad. Úsalo para consultar, no para leerlo entero (en castellano).","Indicadors com la participació del professorat en formació contínua o les taxes de finalització, amb el càlcul i la utilitat. Fes-lo servir per consultar, no per llegir-lo sencer (en castellà)."],"url":"https://www.todofp.es/dam/jcr:8c0bea18-a13a-49c3-ade8-21c1288f9aa8/eqavet.pdf"}]}],"acts":["s2-ind","s2-calc"],"videos":[],"part":1,"time":["50 min","50 min"]},{"num":3,"kind":"theory","title":["3.1.3 y 3.5.4. Instrumentos de evaluación y marco EQAVET","3.1.3 i 3.5.4. Instruments d'avaluació i marc EQAVET"],"nodes":[{"t":"p","x":["Para recoger información rigurosa se usan matrices de evaluación, cuestionarios de satisfacción estandarizados, hojas de seguimiento y control de la acción formativa, auditorías pedagógicas internas y herramientas de feedback docente. Con estos datos cuantitativos y cualitativos se redacta la Memoria Anual de Calidad y Propuesta de Mejora.","Per recollir informació rigorosa s'empren matrius d'avaluació, qüestionaris de satisfacció estandarditzats, fulls de seguiment i control de l'acció formativa, auditories pedagògiques internes i eines de feedback docent. Amb aquestes dades quantitatives i qualitatives es redacta la Memòria Anual de Qualitat i Proposta de Millora."]},{"t":"p","x":["El feedback docente permite registrar áreas de mejora sobre la actualización de contenidos, la metodología, la adaptación a las TIC y los materiales y recursos.","El feedback docent permet registrar àrees de millora sobre l'actualització de continguts, la metodologia, l'adaptació a les TIC i els materials i recursos."]},{"t":"h3","x":["EQAVET: Marco Europeo de Garantía de Calidad de la Formación Profesional","EQAVET: Marc Europeu de Garantia de Qualitat de la Formació Professional"]},{"t":"p","x":["EQAVET (European Quality Assurance in Vocational Education and Training) ofrece un marco de referencia basado en un ciclo de mejora continua de cuatro fases:","L'EQAVET (European Quality Assurance in Vocational Education and Training) proporciona un marc de referència basat en un cicle de millora contínua de quatre fases:"]},{"t":"viz","v":{"type":"cycle","center":["EQAVET","EQAVET"],"items":[{"i":"target","s":"info","x":["Planificación","Planificació"],"d":["Objetivos claros, medibles y adaptados al mercado de trabajo.","Objectius clars, mesurables i adaptats al mercat de treball."]},{"i":"gear","s":"info","x":["Implementación","Implementació"],"d":["Estrategias, procedimientos y recursos.","Estratègies, procediments i recursos."]},{"i":"chart","s":"info","x":["Evaluación","Avaluació"],"d":["Recogida y análisis de datos con indicadores.","Recollida i anàlisi de dades amb indicadors."]},{"i":"cycle","s":"safe","x":["Revisión","Revisió"],"d":["Planes de mejora y ajustes metodológicos.","Plans de millora i ajustos metodològics."]}]}}],"acts":["s2-eqavet","s2-comision"],"videos":[],"part":1,"time":["50 min","50 min"]},{"num":4,"kind":"example","title":["Auditoría exprés de un curso","Auditoria exprés d'un curs"],"nodes":[{"t":"p","x":["Supuesto: un curso presenta un abandono elevado, dificultades digitales del alumnado y poca conexión con las empresas. Con la web de EQAVET, el documento de indicadores y el catálogo de formación del INTEF, completa la tabla.","Supòsit: un curs presenta un abandonament elevat, dificultats digitals de l'alumnat i poca connexió amb les empreses. Amb la web d'EQAVET, el document d'indicadors i el catàleg de formació de l'INTEF, completa la taula."]}],"acts":["s2-auditoria"],"videos":[],"part":1,"time":["35 min","35 min"]},{"num":5,"kind":"theory","title":["3.3. Perfeccionamiento y actualización tecnopedagógica de los formadores","3.3. Perfeccionament i actualització tecnicopedagògica dels formadors"],"nodes":[{"t":"p","x":["La calidad del Sistema de Formación Profesional depende directamente de la cualificación, la competencia digital y la actualización continuada de su profesorado y equipo formador. Los docentes de FP mantienen un doble perfil de actualización:","La qualitat del Sistema de Formació Professional depèn directament de la qualificació, la competència digital i l'actualització continuada del seu professorat i equip formador. Els docents d'FP mantenen un doble perfil d'actualització:"]},{"t":"viz","v":{"type":"compare","vs":true,"cols":[{"i":"wrench","s":"info","x":["Actualización técnica y sectorial","Actualització tècnica i sectorial"],"items":[["Nuevas herramientas, procesos productivos, normativas de sostenibilidad y desarrollos tecnológicos de su familia profesional.","Noves eines, processos productius, normatives de sostenibilitat i desenvolupaments tecnològics de la seva família professional."]]},{"i":"learn","s":"info","x":["Actualización pedagógica y digital","Actualització pedagògica i digital"],"items":[["Metodologías didácticas innovadoras, herramientas digitales de aprendizaje, atención a la diversidad y orientación personalizada.","Metodologies didàctiques innovadores, eines digitals d'aprenentatge, atenció a la diversitat i orientació personalitzada."]]}]}},{"t":"p","x":["El SEPE y las administraciones educativas autonómicas elaboran cada año planes de perfeccionamiento técnico docente, en colaboración con los Centros de Referencia Nacional, institutos de investigación y empresas punteras del sector. Además, el formador u orientador se integra en:","El SEPE i les administracions educatives autonòmiques elaboren anualment plans de perfeccionament tècnic docent, en col·laboració amb els Centres de Referència Nacional, instituts d'investigació i empreses capdavanteres del sector. A més, el formador o orientador s'integra en:"]},{"t":"viz","v":{"type":"cards","items":[{"i":"megaphone","s":"safe","x":["Seminarios, congresos y ferias sectoriales","Seminaris, congressos i fires sectorials"],"d":["Encuentro entre el mundo educativo y el empresarial.","Trobada entre el món educatiu i l'empresarial."]},{"i":"share","s":"safe","x":["Redes profesionales y comunidades de práctica","Xarxes professionals i comunitats de pràctica"],"d":["Intercambio de recursos, s agències descentralitzades de la Unió Europea, no un fons. Creat el 1975 i amb seu a Salònica (Grècia) des de 1995, promou el desenvolupament de la FP i l'aprenentatge permanent: ofereix anàlisis estadístiques, investigació sobre les tendències de les competències i assessorament a la Comissió Europea, als Estats membres i als interlocutors socials."]},{"t":"links","title":null,"items":[{"i":"globe","x":["Acerca del Cedefop (web oficial)","Sobre el Cedefop (web oficial)"],"d":["El organismo europeo y su papel de apoyo a las políticas de educación y formación profesionales (en castellano).","L'organisme europeu i el seu paper de suport a les polítiques d'educació i formació professionals (en castellà)."],"url":"https://www.cedefop.europa.eu/es/about-cedefop"}]},{"t":"h3","x":["3.5.5. Erasmus+, suplementos Europass y cooperación territorial","3.5.5. Erasmus+, suplements Europass i cooperació territorial"]},{"t":"viz","v":{"type":"cards","items":[{"i":"globe","s":"info","x":["Erasmus+","Erasmus+"],"d":["Programa de la UE que financia la movilidad de estudiantes y docentes de FP para hacer prácticas en empresas o estancias formativas en el extranjero. Sucede al Programa de Aprendizaje Permanente (PAP).","Programa de la UE que finança la mobilitat d'estudiants i docents d'FP per fer pràctiques en empreses o estades formatives a l'estranger. Succeeix el Programa d'Aprenentatge Permanent (PAP)."]},{"i":"doc","s":"info","x":["Suplemento Europass","Suplement Europass"],"d":["Describe los conocimientos y capacidades de un certificado profesional o título de FP para que lo entiendan empleadores de cualquier país europeo. Es un complemento informativo, no sustituye al título.","Descriu els coneixements i capacitats d'un certificat professional o títol d'FP perquè l'entenguin ocupadors de qualsevol país europeu. És un complement informatiu, no substitueix el títol."]},{"i":"bulb","s":"info","x":["Erasmus para Jóvenes Emprendedores","Erasmus per a Joves Emprenedors"],"d":["Inte nstrumento de recogida","Instrument de recollida"]],"rows":3},"block":"S2","fields":[["Respuesta","Respuesta"]]},{"id":"s2-auditoria","type":"teacher","origin":"manual","time":["35 min","35 min"],"group":["Equipos","Equips"],"ra":"RA4","ce":"b, c, d","title":["Auditoría exprés: problema → indicador → instrumento → medida → seguimiento","Auditoria exprés: problema → indicador → instrument → mesura → seguiment"],"instr":["Selecciona tres indicadores, propón instrumentos de recogida de datos y diseña dos mejoras; una de ellas debe estar vinculada a la actualización docente (combinación propuesta en la relación de recursos digitales).","Selecciona tres indicadors, proposa instruments de recollida de dades i dissenya dues millores; una ha d'estar vinculada a l'actualització docent (combinació proposada a la relació de recursos digitals)."],"grid":{"cols":[["Problema","Problema"],["Indicador","Indicador"],["Instrumento","Instrument"],["Medida","Mesura"],["Seguimiento","Seguiment"]],"rows":3},"block":"S2","fields":[["Respuesta","Respuesta"]]},{"id":"s2-actual","type":"classify","time":["5 min","5 min"],"ra":"RA4","ce":"e","title":["¿Actualización técnica o pedagógica?","Actualització tècnica o pedagògica?"],"cats":[["Técnica y sectorial","Tècnica i sectorial"],["Pedagógica y digital","Pedagògica i digital"]],"items":[{"x":["Estancia formativa en una empresa del sector","Estada formativa en una empresa del sector"],"c":0},{"x":["Curso sobre una nueva normativa de sostenibilidad del sector","Curs sobre una nova normativa de sostenibilitat del sector"],"c":0},{"x":["Formación en un nuevo proceso productivo","Formació en un nou procés productiu"],"c":0},{"x":["Taller de aprendizaje basado en retos","Taller d'aprenentatge basat en reptes"],"c":1},{"x":["Curso sobre atención a la diversidad","Curs sobre atenció a la diversitat"],"c":1},{"x":["Formación en herramientas digitales de aprendizaje","Formació en eines digitals d'aprenentatge"],"c":1}],"block":"S2","origin":"complementaria"},{"id":"s2-miniplan","type":"teacher","origin":"manual","time":["10 min","10 min"],"group":["Individual","Individual"],"ra":"RA4","ce":"d, e","title":["Miniplan de actualización docente","Miniplà d'actualització docent"],"instr":["Con el catálogo del INTEF, diseña un miniplan de actualización (propuesta de la relación de recursos digitales).","Amb el catàleg de l'INTEF, dissenya un miniplà d'actualització (proposta de la relació de recursos digitals)."],"fields":[["Necesidad detectada","Necessitat detectada"],["Acción formativa","Acció formativa"],["Aplicación en el aula","Aplicació a l'aula"],["Evidencia de mejora","Evidència de millora"]],"block":"S2"},{"id":"s2-europa","type":"match","time":["5 min","5 min"],"ra":"RA4","ce":"h, i","title":["Siglas y programas europeos","Sigles i programes europeus"],"pairs":[{"a":["Cedefop","Cedefop"],"b":["Agencia de la UE para el desarrollo de la FP","Agència de la UE per al desenvolupament de l'FP"],"exp":["Apartado 3.5.1.","Apartat 3.5.1."]},{"a":["EQF","EQF"],"b":["Marco de cualificaciones en 8 niveles","Marc de qualificacions en 8 nivells"],"exp":["Apartado 3.5.2.","Apartat 3.5.2."]},{"a":["EQAVET","EQAVET"],"b":["Marco europeo de garantía de calidad de la FP","Marc europeu de garantia de qualitat de l'FP"],"exp":["Apartado 3.5.4.","Apartat 3.5.4."]},{"a":["Erasmus+","Erasmus+"],"b":["Movilidad de estudiantes y docentes de FP","Mobilitat d'estudiants i docents d'FP"],"exp":["Apartado 3.5.5.","Apartat 3.5.5."]},{"a":["Suplemento Europass","Suplement Europass"],"b":["Explica las competencias de un título a empleadores extranjeros","Explica les competències d'un títol a ocupadors estrangers"],"exp":["Apartado 3.5.5.","Apartat 3.5.5."]}],"block":"S2","origin":"complementaria"},{"id":"s2-movilidad","type":"teacher","origin":"manual","time":["10 min","10 min"],"group":["Parejas","Parelles"],"ra":"RA4","ce":"h · RA3 f","title":["Movilidad o cooperación","Mobilitat o cooperació"],"instr":["Con la web del SEPIE, compara una movilidad del profesorado y un proyecto de cooperación y justifica cuál resolvería mejor una necesidad del centro. Después, explica a una persona que quiere trabajar en otro país qué le aporta el suplemento Europass y qué no garantiza (propuestas de la relación de recursos digitales).","Amb la web del SEPIE, compara una mobilitat del professorat i un projecte de cooperació i justifica quin resoldria millor una necessitat del centre. Després, explica a una persona que vol treballar en un altre país què li aporta el suplement Europass i què no garanteix (propostes de la relació de recursos digitals)."],"fields":[["Necesidad del centro y opción elegida","Necessitat del centre i opció triada"],["Qué aporta y qué no garantiza el suplemento Europass","Què aporta i què no garanteix el suplement Europass"]],"block":"S2"},{"id":"A2UD3","code":"A2UD3","type":"teacher","origin":"manual","time":["60 min","60 min"],"kind":["Evaluación","Avaluació"],"group":["Individual","Individual"],"mode":["Dos juegos encadenados (Educaplay): test y clasificación por grupos","Dos jocs encadenats (Educaplay): test i classificació per grups"],"ra":"RA4","ce":"a, b, c, d, e, f, h, i","title":["Formación de calidad y sin fronteras","Formació de qualitat i sense fronteres"],"statement":[{"t":"p","x":["Imagina que formas parte del equipo que coordina un curso de formación profesional. En el primer juego analizarás un caso real de seguimiento: decide qué indicadores miden la calidad, qué ajustes harías durante el curso y qué mejoras propondrías al terminar. Lee el feedback de cada pregunta antes de continuar. En el segundo juego, clasifica cada recurso según su finalidad: moverte por Europa, actualizarte e innovar, conectar con las empresas o cooperar con otros territorios. Puedes repetir los juegos hasta superar el 80 % de aciertos.","Imagina que formes part de l'equip que coordina un curs de formació professional. En el primer joc analitzaràs un cas real de seguiment: decideix quins indicadors mesuren la qualitat, quins ajustos faries durant el curs i quines millores proposaries en acabar. Llegeix el feedback de cada pregunta abans de continuar. En el segon joc, classifica cada recurs segons la seva finalitat: moure't per Europa, actualitzar-te i innovar, connectar amb les empreses o cooperar amb altres territoris. Pots repetir els jocs fins a superar el 80 % d'encerts."]},{"t":"list","k":"ul","l":1,"items":[["Juego 1 — «Formación de calidad: seguimiento, indicadores y mejora» (test de 10 preguntas). Caso: un curso de mantenimiento de embarcaciones en Menorca con un 30 % de abandono. Indicadores de proceso, resultado e impacto, plan anual de calidad, ajustes y mejoras con el ciclo PDCA.","Joc 1 — «Formació de qualitat: seguiment, indicadors i millora» (test de 10 preguntes). Cas: un curs de manteniment d'embarcacions a Menorca amb un 30 % d'abandonament. Indicadors de procés, resultat i impacte, pla anual de qualitat, ajustos i millores amb el cicle PDCA."],["Juego 2 — «Formación sin fronteras: recursos para innovar y conectar» (clasificación): movilidad europea, actualización e innovación, contacto con empresas y cooperación territorial.","Joc 2 — «Formació sense fronteres: recursos per innovar i connectar» (classificació): mobilitat europea, actualització i innovació, contacte amb empreses i cooperació territorial."]],"start":1},{"t":"p","x":["Resultado esperado: diferenciar indicadores de proceso, resultado e impacto; reconocer los instrumentos de un plan de evaluación de la calidad; proponer ajustes y mejoras concretos, con responsable y plazo; e identificar programas de movilidad, actualización, vinculación con empresas y cooperación territorial. Puntuación mínima orientativa: 80 % en cada juego.","Resultat esperat: diferenciar indicadors de procés, resultat i impacte; reconèixer els instruments d'un pla d'avaluació de la qualitat; proposar ajustos i millores concrets, amb responsable i termini; i identificar programes de mobilitat, actualització, vinculació amb empreses i cooperació territorial. Puntuació mínima orientativa: 80 % en cada joc."]}],"criteria":[{"ra":"RA4","title":["Analiza mecanismos que garanticen la calidad de las acciones formativas, diseñando estrategias de innovación educativa, cooperación territorial y actualización profesional.","Analitza mecanismes que garanteixin la qualitat de les accions formatives, dissenyant estratègies d'innovació educativa, cooperació territorial i actualització professional."],"ce":[["CE4a",["Se han examinado los planes anuales de evaluación de calidad de las acciones formativas, identificando su metodología e indicadores.","S'han examinat els plans anuals d'avaluació de qualitat de les accions formatives, identificant la seva metodologia i indicadors."]],["CE4b",["Se han determinado los parámetros de calidad que miden los procesos y objetivos de la formación, verificando la adecuación de las acciones formativas y de la orientación profesional.","S'han determinat els paràmetres de qualitat que mesuren els processos i objectius de la formació, verificant l'adequació de les accions formatives i de l'orientació professional."]],["CE4c",["Se han identificado necesidades de cambio durante el seguimiento de la acción formativa, incorporando los ajustes necesarios para mejorar la calidad de la formación.","S'han identificat necessitats de canvi durant el seguiment de l'acció formativa, incorporant els ajustos necessaris per a millorar la qualitat de la formació."]],["CE4d",["Se han propuesto áreas de mejora tras la evaluación de la calidad de una acción formativa, señalando medidas innovadoras para mejorar los resultados.","S'han proposat àrees de millora després de l'avaluació de la qualitat d'una acció formativa, assenyalant mesures innovadores per a millorar els resultats."]],["CE4e",["Se han identificado programas o acciones (seminarios, ferias, redes profesionales, entre otros) que complementen la formación técnica y didáctica, favoreciendo la aplicación de procesos innovadores.","S'han identificat programes o accions (seminaris, fires, xarxes professionals, entre altres) que complementin la formació tècnica i didàctica, afavorint l'aplicació de processos innovadors."]],["CE4f",["Se han indicado procedimientos para mantener un contacto permanente con las empresas del sector, actualizando de forma continuada las necesidades del sector productivo.","S'han indicat procediments per a mantenir un contacte permanent amb les empreses del sector, actualitzant de forma continuada les necessitats del sector productiu."]],["CE4h",["Se ha considerado la participación en programas de movilidad europeos dirigidos a estudiar y trabajar en el extranjero (Proyecto Erasmus+, Suplementos Europass, programas europeos de intercambio para jóvenes emprendedores, intercambios educativos y empresariales, entre otros).","S'ha considerat la participació en programes de mobilitat europeus dirigits a estudiar i treballar a l'estranger (Projecte Erasmus+, Suplements Europass, programes europeus d'intercanvi per a joves emprenedors, intercanvis educatius i empresarials, entre altres)."]],["CE4i",["Se han valorado las acciones educativas en el exterior y los Programas de Cooperación Territorial cofinanciados por el Fondo Social Europeo que impulsan la orientación y la ocupabilidad dentro del Sistema de Formación Profesional.","S'han valorat les accions educatives en l'exterior i els Programes de Cooperació Territorial cofinançats pel Fons Social Europeu que impulsen l'orientació i ocupabilitat dins del Sistema de Formació Professional."]]]}],"embed":[{"t":"embed","title":["Juego 1 · Formación de calidad: seguimiento, indicadores y mejora (Educaplay)","Joc 1 · Formació de qualitat: seguiment, indicadors i millora (Educaplay)"],"src":"https://www.educaplay.com/game/31530102-formacion_de_calidad_seguimiento_indicadores_y_mejora.html","url":"https://www.educaplay.com/game/31530102-formacion_de_calidad_seguimiento_indicadores_y_mejora.html","ratio":"16:9","h":700},{"t erimentació i millora de la qualificació professional."]},{"t":"viz","v":{"type":"cards","items":[{"i":"search","s":"info","x":["Observatorio sectorial y de prospectiva","Observatori sectorial i de prospectiva"],"d":["Analiza la evolución de las cualificaciones y las nuevas tendencias tecnológicas del sector.","Analitza l'evolució de les qualificacions i les noves tendències tecnològiques del sector."]},{"i":"flask","s":"info","x":["Experimentación y diseño de contenidos","Experimentació i disseny de continguts"],"d":["Elabora y experimenta recursos didácticos, guías y propuestas de revisión de certificados profesionales y grados formativos.","Elabora i experimenta recursos didàctics, guies i propostes de revisió de certificats professionals i graus formatius."]},{"i":"check","s":"info","x":["Evaluación y reconocimiento de competencias","Avaluació i reconeixement de competències"],"d":["Apoya los procedimientos de acreditación de competencias adquiridas por experiencia laboral.","Dona suport als procediments d'acreditació de competències adquirides per experiència laboral."]}]}},{"t":"p","x":["Los CRN garantizan la unidad de mercado y la cohesión territorial del Sistema de FP e impulsan la colaboración entre el Ministerio de Educación, Formación Profesional y Deportes, el Ministerio de Trabajo y Economía Social, las comunidades autónomas, las organizaciones empresariales y los sindicatos.","Els CRN garanteixen la unitat de mercat i la cohesió territorial del Sistema d'FP i impulsen la col·laboració entre el Ministeri d'Educació, Formació Professional i Esports, el Ministeri de Treball i Economia Social, les comunitats autònomes, les organitzacions empresarials i els sindicats."]},{"t":"links","title":null,"items":[{"i":"building","x":["Centros de Referencia Nacional (TodoFP)","Centres de Referència Nacional (TodoFP)"],"d":["Qué son los CRN y sus funciones de innovación, experimentación, colaboración empresarial y perfeccionamiento del personal formador (en castellano).","Què són els CRN i les seves funcions d'innovació, experimentació, col·laboració empresarial i perfeccionament del personal formador (en castellà)."],"url":"https://www.todofp.es/como-cuando-y-donde-estudiar/donde-estudiar/centros-referencia-nacional.html"}]},{"t":"video","id":"frio","title":["Formarse en frío y climatización: empleo asegurado en un sector que busca relevo generacional","Formar-se en fred i climatització: ocupació assegurada en un sector que busca relleu generacional"],"source":["Telemadrid","Telemadrid"],"duration":"4:36","url":"https://www.youtube.com/watch?v=t-2L-UD_Hyc","verified":true,"langLabel":["en castellano","en castellà"],"moment":["después de las funciones de los CRN: un CRN conectado con un sector.","després de les funcions dels CRN: un CRN connectat amb un sector."],"use":["Muestra el CRN de Moratalaz y la conexión entre formación, certificación y necesidades de un sector productivo.","Mostra el CRN de Moratalaz i la connexió entre formació, certificació i necessitats d'un sector productiu."],"question":["Identifica tres necesidades del sector y dos respuestas formativas. ¿Basta el titular «empleo asegurado» para orientar una decisión profesional?","Identifica tres necessitats del sector i dues respostes formatives. N'hi ha prou amb el titular «ocupació assegurada» per orientar una decisió professional?"]}],"acts":["s3-crn","s3-fichacrn"],"videos":[],"part":1,"time":["50 min","50 min"]},{"num":2,"kind":"theory","title":["3.2.3 y 3.5.6. Actualización e innovación en la formación profesional","3.2.3 i 3.5.6. Actualització i innovació en la formació professional"],"nodes":[{"t":"p","x":["Mediante la transferencia de buenas prácticas y los bancos de recursos abiertos, los CRN introducen metodologías activas (como el aprendizaje basado en retos o la simulación inmersiva) y nuevas tecnologías (IA, digitalización y sostenibilidad) en los currículos formativos.","Mitjançant la transferència de bones pràctiques i la creació de bancs de rec ad formativa y la orientación profesional deben incorporar de forma transversal el desarrollo sostenible y los Objetivos de Desarrollo Sostenible (ODS) de la Agenda 2030. Los 17 ODS conectan la sostenibilidad ambiental con la inclusión, la igualdad y el trabajo decente, y relacionan la protección del planeta con los derechos humanos y la participación social.","La qualitat formativa i l'orientació professional han d'incorporar de manera transversal el desenvolupament sostenible i els Objectius de Desenvolupament Sostenible (ODS) de l'Agenda 2030. Els 17 ODS connecten la sostenibilitat ambiental amb la inclusió, la igualtat i el treball digne, i relacionen la protecció del planeta amb els drets humans i la participació social."]},{"t":"video","id":"ods","title":["Los Objetivos de Desarrollo Sostenible: qué son y cómo alcanzarlos","Els Objectius de Desenvolupament Sostenible: què són i com assolir-los"],"source":["UNESCO en español (realizado por UNESCO Etxea)","UNESCO en espanyol (realitzat per UNESCO Etxea)"],"duration":"6:01","url":"https://www.youtube.com/watch?v=MCKH5xk8X-g","verified":true,"langLabel":["en castellano","en castellà"],"moment":["al empezar el RA6: qué son la Agenda 2030 y los ODS.","en començar el RA6: què són l'Agenda 2030 i els ODS."],"use":["Explica la Agenda 2030, los ODS y la relación entre protección del planeta, igualdad, derechos humanos y participación social.","Explica l'Agenda 2030, els ODS i la relació entre protecció del planeta, igualtat, drets humans i participació social."],"question":["Completa tres filas: problema detectado → ODS relacionado → medida aplicable en un centro formativo o empresa.","Completa tres files: problema detectat → ODS relacionat → mesura aplicable en un centre formatiu o empresa."]},{"t":"p","x":["La programación propone tres líneas para llevar la sostenibilidad a la formación y la orientación:","La programació proposa tres línies per portar la sostenibilitat a la formació i l'orientació:"]},{"t":"viz","v":{ , b, c, d, e, f, g","title":["Orientación sostenible: ODS y entorno profesional","Orientació sostenible: ODS i entorn professional"],"statement":[{"t":"p","x":["Los Objetivos de Desarrollo Sostenible también se juegan en el trabajo. En el primer juego, lee cada acción profesional y colócala en el ODS al que contribuye. En el segundo, analiza cada caso de empresa: piensa qué impacto genera, a quién afecta y qué medida lo reduciría de verdad. Fíjate en el feedback: te dará ideas para tu futuro puesto y tu día a día.","Els Objectius de Desenvolupament Sostenible també es juguen a la feina. En el primer joc, llegeix cada acció professional i col·loca-la a l'ODS al qual contribueix. En el segon, analitza cada cas d'empresa: pensa quin impacte genera, a qui afecta i quina mesura el reduiria de debò. Fixa't en el feedback: et donarà idees per al teu futur lloc de feina i el teu dia a dia."]},{"t":"list","k":"ul","l":1,"items":[["Juego 1 — «ODS en acción» (clasificación): acciones de los sectores náutico, hostelería, administración y sanitario de Menorca asociadas a los ODS 4, 5, 8, 12, 13 y 14.","Joc 1 — «ODS en acció» (classificació): accions dels sectors nàutic, hostaleria, administració i sanitari de Menorca associades als ODS 4, 5, 8, 12, 13 i 14."],["Juego 2 — «Impactos y medidas sostenibles» (test con casos): un astillero que vierte residuos, un hotel con alto consumo de agua o una gestoría con exceso de papel. Identifica el impacto, su efecto y la medida más adecuada.","Joc 2 — «Impactes i mesures sostenibles» (test amb casos): una drassana que aboca residus, un hotel amb un consum alt d'aigua o una gestoria amb excés de paper. Identifica l'impacte, el seu efecte i la mesura més adequada."]],"start":1},{"t":"p","x":["Resultado esperado: explicar qué es el desarrollo sostenible e identificar los ODS ligados a tu profesión y entorno; analizar cómo los impactos ambientales y sociales afectan a las personas y al tejido productivo; establecer criterios de sostenibilidad; y proponer medidas innovadoras para minimizarlos. Puntuación mínima orientativa: 80 % en cada juego.","Resultat esperat: explicar què és el desenvolupament sostenible i identificar els ODS lligats a la teva professió i entorn; analitzar com els impactes ambientals i socials afecten les persones i el teixit productiu; establir criteris de sostenibilitat; i proposar mesures innovadores per minimitzar-los. Puntuació mínima orientativa: 80 % en cada joc."]}],"criteria":[{"ra":"RA6","title":["Caracteriza los retos ambientales y sociales a los que se enfrenta el entorno profesional y productivo, teniendo en cuenta el concepto de desarrollo sostenible en el proceso de información y orientación laboral.","Caracteritza els reptes ambientals i socials als quals s'enfronta l'entorn professional i productiu, tenint en compte el concepte de desenvolupament sostenible en el procés d'informació i orientació laboral."],"ce":[["CE6a",["Se ha descrito el concepto de sostenibilidad, analizando los Objetivos de Desarrollo Sostenible (ODS).","S'ha descrit el concepte de sostenibilitat, analitzant els Objectius de Desenvolupament Sostenible (ODS)."]],["CE6b",["Se han identificado los ODS más relevantes para la actividad profesional y el entorno personal.","S'han identificat els ODS més rellevants per a l'activitat professional i l'entorn personal."]],["CE6c",["Se ha analizado el efecto de los impactos ambientales y sociales sobre las personas y el sector productivo, en diferentes contextos de la actividad profesional.","S'ha analitzat l'efecte dels impactes ambientals i socials sobre les persones i el sector productiu, en diferents contextos de l'activitat professional."]],["CE6d",["Se han establecido criterios de sostenibilidad relacionados con el desempeño profesional y personal.","S'han establit criteris de sostenibilitat relacionats amb l'acompliment professional i personal."]],["CE6e",["Se han identificado las acciones necesarias para atender algunos de los retos ambientales y sociales desde diferentes contextos de actividad profesional.","S'han identificat les accions necessàries per a atendre alguns dels reptes ambientals i socials des de diferents contextos d'activitat professional."]],["CE6f",["Se han propuesto medidas encaminadas a minimizar los impactos ambientales y sociales, en diferentes contextos de actividad profesional.","S'han proposat mesures encaminades a minimitzar els impactes ambientals i socials, en diferents contextos d'activitat professional."]],["CE6g",["Se han definido recursos y acciones innovadoras para promover los ODS y su implementación en los entornos profesionales.","S'han definit recursos i accions innovadores per a promoure els ODS i la seva implementació en els entorns professionals."]]]}],"embed":[{"t":"embed","title":["Juego 1 · ODS en acción (Educaplay)","Joc 1 · ODS en acció (Educaplay)"],"src":"https://www.educaplay.com/game/31530988-ods_en_accion_sostenibilidad_en_el_entorno_profesional.html","url":"https://www.educaplay.com/game/31530988-ods_en_accion_sostenibilidad_en_el_entorno_profesional.html","ratio":"16:9","h":700},{"t":"embed","title":["Juego 2 · Impactos y medidas sostenibles (Educaplay)","Joc 2 · Impactes i mesures sostenibles (Educaplay)"],"src":"https://www.educaplay.com/game/31531311-impactos_y_medidas_sostenibles_en_el_entorno_profesional.html","url":"https://www.educaplay.com/game/31531311-impactos_y_medidas_sostenibles_en_el_entorno_profesional.html","ratio":"16:9","h":700}],"fields":[["Puntuación del juego 1","Puntuació del joc 1"],["Puntuación del juego 2","Puntuació del joc 2"],["Un criterio de sostenibilidad que aplicarás en tu desempeño profesional","Un criteri de sostenibilitat que aplicaràs en el teu acompliment professional"]],"rubric":["Instrumento de evaluación: corrección automática con la herramienta digital (relacionar grupos y quiz de Educaplay), con informe de puntuaciones.","Instrument d'avaluació: correcció automàtica amb l'eina digital (relacionar grups i quiz d'Educaplay), amb informe de puntuacions."],"block":"S3"},{"id":"ud3-eval","type":"mcq","origin":"manual","time":["25 min","25 min"],"ra":"RA3 · RA4 · RA6","ce":["todos los de la UD3","tots els de la UD3"],"title":["Cuestionario de evaluación (UD3)","Qüestionari d'avaluació (UD3)"],"questions":[{"q":["¿Cuál es el objetivo principal de la evaluación de la calidad de las acciones formativas según el ciclo EQAVET?","Quin és l'objectiu principal de l'avaluació de la qualitat en les accions formatives del Sistema de Formació Professional segons el cicle EQAVET?"],"opts":[["Determinar solo la calificación numérica del alumnado al final del curso.","Determinar exclusivament la qualificació acadèmica numèrica de l'alumnat al final del curs."],["Establecer un proceso continuado de mejora basado en planificar, implementar, evaluar y revisar para adecuar la formación a las necesidades laborales.","Establir un procés continuat de millora basat en la planificació, implementació, avaluació i revisió per adequar la formació a les necessitats laborals."],["Comprobar el gasto económico sin evaluar la satisfacción.","Comprovar el compliment estricte de la despesa econòmica sense avaluar la satisfacció dels usuaris."],["Sustituir la función docente por auditorías externas automatizadas.","Substituir la funció docent per auditories externes automatitzades."]],"ans":1,"exp":["EQAVET define la calidad como un ciclo de mejora continua (planificación, implementación, evaluación y revisión) para adaptar la FP a las demandas del tejido productivo.","L'EQAVET defineix la qualitat com un cicle sistemàtic de millora contínua (planificació, implementació, avaluació i revisió) per garantir que l'FP s'adapti a les demandes del teixit productiu."]},{"q":["La tasa de inserción laboral a los 6 meses de terminar la formación es un indicador…","Dins dels indicadors de qualitat formativa, la taxa d'inserció laboral als 6 mesos de finalitzar la formació es classifica com un:"],"opts":[["de eficiencia económica interna.","Indicador d'eficiència econòmica interna."],["de impacto y empleabilidad.","Indicador d'impacte i ocupabilitat."],["de proceso metodológico.","Indicador de procés metodològic."],["de evaluación diagnóstica inicial.","Indicador d'avaluació diagnòstica inicial."]],"ans":1,"exp":["Los indicadores de impacto y empleabilidad miden la capacidad real de la formación para facilitar la inserción y la transferencia de aprendizajes.","Els indicadors d'impacte i ocupabilitat mesuren la capacitat real de la formació per facilitar la inserció laboral i la transferència d'aprenentatges."]},{"q":["¿Cuál es la función principal de los Centros de Referencia Nacional (CRN)?","Quina és la funció principal dels Centres de Referència Nacional (CRN) en el Sistema de Formació Professional?"],"opts":[["Impartir solo educación secundaria obligatoria a nivel local.","Impartir exclusivament educació secundària obligatòria a nivell local."],["Ser centros punteros en innovación, experimentación, prospectiva sectorial y actualización de las cualificaciones a nivel estatal.","Actuar com a centres capdavanters en innovació, experimentació, prospectiva sectorial i actualització de les qualificacions professionals a nivell estatal."],["Gestionar el registro de contratos de las empresas privadas.","Gestionar el registre de contractes laborals de les empreses privades."],["Emitir únicamente pasaportes Europass.","Emetre únicament els passaports Europass."]],"ans":1,"exp":["Los CRN son centros públicos de excelencia estatal que lideran la investigación, la experimentación y el desarrollo de cualificaciones y recursos en su familia profesional.","Els CRN són centres públics d'excel·lència estatal que lideren la investigació, experimentació i desenvolupament de noves qualificacions i recursos en les seves famílies professionals."]},{"q":["¿Cómo se define el ciclo de mejora continua del marco EQAVET?","Com es defineix el cicle de millora contínua de la qualitat proposat pel marc europeu EQAVET?"],"opts":[["Diagnóstico, negociación, ejecución y cierre.","Diagnòstic, negociació, execució i tancament."],["Planificación, implementación, evaluación y revisión.","Planificació, implementació, avaluació i revisió."],["Inscripción, impartición, examen y titulación.","Inscripció, impartició, examen i titulació."],["Encuesta, selección, acreditación y archivo.","Enquesta, selecció, acreditació i arxiu."]],"ans":1,"exp":["Las cuatro fases del ciclo de Deming adaptado a la educación.","Les quatre fases del cicle de Deming adaptat a l'educació."]},{"q":["¿Qué organismo de la UE, creado en 1975 y con sede en Salónica, investiga y analiza las tendencias del mercado laboral y de la FP?","Quin organisme de la Unió Europea, fundat el 1975 i amb seu a Salònica, és l'encarregat de dur a terme investigacions i anàlisis sobre les tendències del mercat laboral i la Formació Professional?"],"opts":[["EURES.","EURES."],["Cedefop (Centro Europeo para el Desarrollo de la Formación Profesional).","Cedefop (Centre Europeu per al Desenvolupament de la Formació Professional)."],["Fondo Social Europeo (FSE+).","Fons Social Europeu (FSE+)."],["Consejo de Europa.","Consell d'Europa."]],"ans":1,"exp":["El Cedefop es la agencia europea que analiza la evolución de la FP, anticipa las necesidades de competencias y apoya las políticas de formación de la UE.","El Cedefop és l'agència de referència europea encarregada d'analitzar l'evolució dels sistemes d'FP, anticipar les necessitats de competències i donar suport a les polítiques de formació a la UE."]},{"q":["El Marco Europeo de Cualificaciones (EQF/MEC) se estructura en 8 niveles basados en:","El Marc Europeu de Qualificacions (EQF / MEC) s'estructura en 8 nivells basats en:"],"opts":[["El número de horas lectivas presenciales.","El nombre d'hores lectives presencials realitzades per l'estudiant."],["Los resultados de aprendizaje: conocimientos, destrezas, responsabilidad y autonomía.","Els resultats d'aprenentatge expressats en coneixements, destreses, responsabilitat i autonomia."],["La edad del alumnado al matricularse.","L'edat cronològica de l'alumnat en el moment de la matriculació."],["El coste de la matrícula.","El cost financer de la matrícula en el centre educatiu."]],"ans":1,"exp":["El EQF basa su escala exclusivamente en resultados de aprendizaje.","L'EQF basa la seva escala de 8 nivells exclusivament en els resultats d'aprenentatge."]},{"q":["¿Qué documento Europass describe las competencias y resultados de aprendizaje de un certificado profesional o título de FP para que lo entiendan empleadores de otros países?","Quin document de la família Europass descriu de forma detallada les competències, capacitats i resultats d'aprenentatge associats a un Certificat Professional o Títol d'FP per facilitar-ne la comprensió per ocupadors estrangers?"],"opts":[["El contrato de formación en empresa.","El Contracte de Formació en Empresa."],["El suplemento Europass al título o certificado.","El Suplement Europass al Títol o Certificat."],["La licencia única docente.","La Llicència Única Docent."],["La hoja de registro del SEPE.","El Full de Registre del SEPE."]],"ans":1,"exp":["El suplemento acompaña a los títulos de FP y certificados profesionales y explica las competencias adquiridas para su valoración internacional.","El Suplement Europass acompanya els títols d'FP i Certificats Professionals i explicita les competències adquirides per a la seva valoració internacional."]},{"q":["¿Qué actividad contribuye directamente a la actualización técnica sectorial del profesorado de FP?","En el marc del perfeccionament i actualització del professorat d'FP, quina activitat contribueix directament a l'actualització tècnica sectorial?"],"opts":[["Las estancias formativas en empresas del sector y los proyectos de innovación con los CRN.","La realització d'estades formatives en empreses del sector i la participació en projectes d'innovació amb CRN."],["Repetir los mismos apuntes de años anteriores.","La repetició sistemàtica dels mateixos apunts d'anys anteriors sense canvis."],["Gestionar las faltas de asistencia.","La gestió administrativa de les faltes d'assistència de l'alumnat."],["Eliminar el contacto con las empresas.","L'eliminació del contacte amb el teixit empresarial."]],"ans":0,"exp":["La actualización técnica exige contacto directo con el entorno productivo: estancias en empresas, proyectos con los CRN y formación en nuevas tecnologías.","L'actualització tècnica requereix contacte directe amb l'entorn de producció: estades en empreses, projectes amb els CRN i formació en noves tecnologies."]},{"q":["Según el RA6, ¿cómo se integra el desarrollo sostenible en la calidad de las acciones formativas?","Pel que fa al RA6, com s'integra el desenvolupament sostenible en la qualitat de les accions formatives d'orientació professional?"],"opts":[["Reduciendo horas de clase para ahorrar electricidad.","Reduint les hores de classe per estalviar energia elèctrica al centre."],["Incorporando green skills y acciones alineadas con los ODS en los currículos y las prácticas.","Identificant i incorporant green skills (competències verdes) i accions alineades amb els ODS en els currículums i pràctiques professionals."],["Evitando hablar de los retos ambientales.","Evitant parlar dels reptes ambientals per no generar preocupació en l'alumnat."],["Eliminando la tecnología digital de las aulas.","Eliminant l'ús de la tecnologia digital a les aules."]],"ans":1,"exp":["El RA6 exige alinear orientación y calidad formativa con la transición ecológica mediante green skills y los ODS.","El RA6 exigeix que l'orientació laboral i la qualitat formativa s'alineïn amb la transició ecològica a través de competències verdes i els ODS."]},{"q":["¿Qué relación tienen los certificados profesionales (grado C) con el tejido productivo según el RD 86/2026?","Quina relació existeix entre els Certificats Professionals (Grau C de l'SFP) i el teixit productiu segons el RD 86/2026?"],"opts":[["Son títulos académicos sin relación con las competencias del mercado de trabajo.","Són títols acadèmics sense cap relació amb les competències requerides pel mercat de treball."],["Acreditan oficialmente las unidades de competencia de una cualificación profesional, de modo que la formación responde a las necesidades de las empresas.","Acrediten oficialment les unitats de competència d'una qualificació professional, garantint que la formació respon a les necessitats reals de les empreses."],["Son certificados privados no reconocidos por la Administración.","Són certificats de caràcter privat no reconeguts per l'Administració Pública."],["Se otorgan automáticamente sin superar ningún módulo.","S'atorguen automàticament sense necessitat de superar cap mòdul formatiu."]],"ans":1,"exp":["Los certificados profesionales tienen validez oficial y acreditan unidades de competencia vinculadas al Catálogo Nacional de Cualificaciones Profesionales.","Els Certificats Professionals tenen validesa oficial i acrediten unitats de competència vinculades al Catàleg Nacional de Qualificacions Professionals."]}],"block":"S3"}],"notes":[["Texto de la unidad: programación didáctica de la UD3 (en catalán) y temario de la UD3; cada texto se ha traducido con fidelidad al otro idioma. Se han aplicado las precisiones del docente: Cedefop es el Centro Europeo para el Desarrollo de la Formación Profesional y los antiguos certificados de profesionalidad son hoy certificados profesionales (grado C), según TodoFP.","Text de la unitat: programació didàctica de la UD3 (en català) i temari de la UD3; cada text s'ha traduït amb fidelitat a l'altre idioma. S'han aplicat les precisions del docent: el Cedefop és el Centre Europeu per al Desenvolupament de la Formació Professional i els antics certificats de professionalitat són avui certificats professionals (grau C), segons TodoFP."],["La sostenibilidad no tiene epígrafe propio en el índice de la unidad: el contenido del RA6 sale del apartado transversal de la programación       var bd = h("button", { type: "button", class: "btn big", onclick: function () {
        // Formulario en una pestaña nueva: viaja con la sesión de Google del alumnado (scripts limitados al dominio
        // del centro) y la pestaña muestra la respuesta real del script (enviado o inicio de sesión).
        var d = mailData();
        var f = h("form", { method: "POST", action: M.mailEndpoint, target: "_blank", style: "display:none" },
          h("input", { type: "hidden", name: "payload" }));
        f.firstChild.value = JSON.stringify({ key: M.mailKey || "", course: M.short || "", subject: d.subj, name: S.student.name.trim(), group: S.student.group.trim(), scope: repLabel(), lang: S.lang, text: d.txt });
        document.body.appendChild(f); f.submit(); f.remove();
        logMail("directo"); toast(t("mailOpened"));
      } }, t("mailDirect"));
      box.appendChild(h("div", { class: "mail-opt main" }, bd, h("p", { class: "hint" }, t("mailDirectHint"))));
    }
    function compose(kind) {
      var d = mailData(), enc = encodeURIComponent, lim = kind === "gmail" ? 6500 : 1800;
      var body = enc(d.txt).length < lim ? d.txt : t("mailPaste") + "\n\n" + S.student.name + " (" + S.student.group + ") · " + repLabel();
      quietCopy(d.txt).then(function () { toast(t("mailCopied")); });
      logMail(kind);
      var url = kind === "gmail" ? "https://mail.google.com/mail/?view=cm&fs=1&to=" + enc(M.mailTo || "") + "&su=" + enc(d.subj) + "&body=" + enc(body)
        : "mailto:" + (M.mailTo || "") + "?subject=" + enc(d.subj) + "&body=" + enc(body);
      if (kind === "gmail") window.open(url, "_blank", "noopener"); else window.location.href = url;
    }
    if (M.mailTo) box.appendChild(h("div", { class: "mail-opt" },
      h("button", { type: "button", class: M.mailEndpoint ? "btn ghost" : "btn", onclick: function () { compose("gmail"); } }, t("mailGmail")),
      h("button", { type: "button", class: "btn ghost", onclick: function () { compose("app"); } }, t("mailApp"))));
    box.appendChild(h("p", { class: "hint" }, t("mailHint")));
    if (S.mails && S.mails.length) box.appendChild(h("div", null, h("p", null, h("b", null, t("mailLog"))),
      h("ul", { class: "mail-log" }, S.mails.slice(-6).reverse().map(function (m) { return h("li", null, new Date(m.at).toLocaleString(S.lang === "es" ? "es-ES" : "ca-ES") + " · " + m.scope + " · " + m.how); }))));
    return overlayShell("mail", t("mailTitle"), box);
  }
  function validReport() {
    if (!S.student.name.trim() || !S.student.group.trim()) {
      toast(t("needId")); window.scrollTo(0, 0);
      var el = document.getElementById(!S.student.name.trim() ? "st-name" : "st-group");
      if (el) { var dd = el.closest("details"); if (dd) dd.open = true; el.focus(); }
      return false;
    }
    if (collect().doneN === 0 && !window.confirm(t("emptyWarn"))) return false;
    return true;
  }
  function generateReport(scope) {
    REP = scope && scope.k ? scope : null;
    if (validReport()) openOv("report");
  }
  function printReport() {
    var fo = document.getElementById("finalobs"), pv = document.getElementById("finalobs-print");
    if (fo && pv) { pv.textContent = fo.value || "—"; pv.style.display = ""; fo.parentNode.querySelector("textarea").style.display = "none"; }
    document.body.classList.add("print-report");
    var old = document.title; document.title = "Informe_" + (M.short || "Web") + "_" + (REP ? REP.id : t("day") + C.day) + "_" + slug(S.student.name);
    window.print();
    setTimeout(function () {
      document.title = old; document.body.classList.remove("print-report");
      if (fo && pv) { pv.style.display = "none"; fo.style.display = ""; }
    }, 600);
  }
  function copyReport() {
    var txt = reportPlain(collect());
    var fb = document.getElementById("copyfallback");
    function fallback() { fb.style.display = "block"; fb.value = txt; fb.focus(); fb.select(); toast(t("copyFail")); }
    if (navigator.clipboard && window.isSecureContext !== false) {
      navigator.clipboard.writeText(txt).then(function () { toast(t("copied")); }, function () {
        fb.value = txt; fb.style.display = "block"; fb.select();
        try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
        fallback();
      });
    } else {
      fb.value = txt; fb.style.display = "block"; fb.select();
      try { if (document.execCommand("copy")) { toast(t("copied")); return; } } catch (e) { }
      fallback();
    }
  }
  window.addEventListener("afterprint", function () { document.body.classList.remove("print-report"); });

  // API mínima per a proves automàtiques
  window.PRL = { state: function () { return S; }, report: function () { return reportPlain(collect()); }, go: go, setLang: setLang };
  render();
})();

</script>
</body>
